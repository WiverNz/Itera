name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew -p buildSrc --no-daemon test
      - run: bash ./gradlew --no-daemon spotlessCheck
      - run: bash ./gradlew --no-daemon lintDebug
      - run: bash ./gradlew --no-daemon testDebugUnitTest
      - run: bash ./gradlew --no-daemon verifyRoborazziDebug
      - run: bash ./gradlew --no-daemon koverVerify
      - run: bash ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/**
