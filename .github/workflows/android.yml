name: Android
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # nightly instrumented run (docs/testing/03-ci.md section 1)
    - cron: '0 3 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/tests/test_release.py
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew -p buildSrc --no-daemon test
      - run: bash ./gradlew --no-daemon spotlessCheck lintDebug testDebugUnitTest verifyRoborazziDebug koverVerify assembleDebug
      # Schema guard: an entity change without a version bump rewrites the committed export; a new version adds an
      # export that SchemaMigrationGuardTest only accepts with its migration.
      - name: Committed Room schemas match the build
        run: |
          git diff --exit-code -- app/schemas
          test -z "$(git status --porcelain -- app/schemas)"
      - uses: actions/upload-artifact@v4
        with:
          name: Itera-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/**
            buildSrc/build/reports/**
  instrumented:
    # emulator boot dominates, so not on every push: pull requests to main, nightly and on demand
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/**
